name: Demo auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deploy zur Zeit; laufende Deploys werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Statischen Export bauen
        env:
          DEPLOY_TARGET: pages
          # Die Demo liegt unter github.io/<repo>/. Ohne diesen Unterpfad
          # würden alle Verweise auf die Kontowurzel zeigen.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:pages

      - name: Jekyll abschalten
        # Ohne diese Datei verschluckt GitHub Pages alle Ordner mit Unterstrich,
        # also auch _next/ mit sämtlichen Skripten und Stilen.
        run: touch out/.nojekyll

      - name: Export prüfen
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run export:pruefen

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
